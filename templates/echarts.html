{% extends 'home.html' %}

{% load static %}

{% block content %}
    {% include 'menu.html' %}
    <div class="col-md-9">
        <div class="panel panel-warning">
            <div class="panel-heading">
                <h3 class="panel-title"><span class="glyphicon glyphicon-map-marker"></span>&nbsp;收藏景点分布</h3>
            </div>
            <div class="layui-row">
                <div class="layui-row layui-col-md12" style="margin-top: 30px">
                    <div class="layui-row layui-col-md5 layui-col-md-offset1">
                        <div id="pie" style="width: 100%;height:360px;"></div>
                        <div style="margin-top: 30px;text-align: center">
                            <p>收藏分布图</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'echarts.min.js' %}"></script>
    <script src="{% static 'base/js/jquery.min.js' %}"></script>
    <script type="text/javascript">
        var myChart2 = echarts.init(document.getElementById('pie'));
        var option2;
        option2 = {
            legend: {
                top: 'bottom'
            },
            toolbox: {
                show: true,
                feature: {
                    mark: {show: true},
                    dataView: {show: true, readOnly: false},
                    restore: {show: true},
                    saveAsImage: {show: true}
                }
            },
            series: [
                {
                    name: '',
                    type: 'pie',
                    radius: [50, 140],
                    center: ['50%', '45%'],
                    roseType: 'area',
                    itemStyle: {
                        borderRadius: 8
                    },
                    data: []
                }
            ],
            tooltip: {
                trigger: 'item',
                formatter: '{b}: {c} ({d}%)'
            }
        };
        myChart2.setOption(option2);

        $.get("{% url 'statics_api' %}").done(function (data) {
            myChart2.setOption({
                series: [{
                    data: data.data
                }]
            });
        });
    </script>
{% endblock %}
